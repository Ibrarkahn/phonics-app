<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phonics App</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Confetti -->
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script defer src="app.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand__title">Phonics</div>
      <div class="brand__subtitle" id="statusLine">Loading…</div>
    </div>

    <button id="modeToggle" class="btn btn--ghost" aria-label="Toggle Parent/Child mode">
      👨‍👩‍👦 Parent Mode
    </button>
  </header>

  <main class="container">
    <section class="panel">
      <button id="continueBtn" class="btn btn--primary btn--big">
        👉 Continue where I left off
      </button>

      <div class="row">
        <div class="field">
          <label for="termSelect">Term</label>
          <select id="termSelect"></select>
        </div>

        <div class="field">
          <label>Weeks</label>
          <div id="weeks" class="weeks"></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel__header">
        <h2 id="weekTitle">Week</h2>
        <div class="pill" id="modePill">👶 Child Mode</div>
      </div>

      <div class="split">
        <div class="card">
          <h3>Sounds / Letters</h3>
          <div id="soundsGrid" class="grid"></div>
        </div>

        <div class="card">
          <h3>Blending Words</h3>
          <div id="wordsGrid" class="grid grid--words"></div>
        </div>
      </div>
    </section>

    <!-- Reward Modal -->
    <div id="rewardModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal__backdrop" id="modalBackdrop"></div>
      <div class="modal__content">
        <div class="modal__emoji" id="modalEmoji">⭐</div>
        <div class="modal__title" id="modalTitle">Well done!</div>
        <div class="modal__text" id="modalText">You completed this week.</div>
        <button id="modalClose" class="btn btn--primary">Nice!</button>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </main>
</body>
</html>
