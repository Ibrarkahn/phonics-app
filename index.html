<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phonics Fun</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400&family=Poppins:wght@500&display=swap" rel="stylesheet">

  <!-- Your stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- HOME HEADER (now a single “card”) -->
  <header class="app-header">
    <div class="header-card">
      <div class="logo-container">
        <svg width="90" height="90" viewBox="0 0 100 100" aria-label="Phonics Fun Logo">
          <circle cx="50" cy="50" r="48" fill="#FF6B35"/>
          <text x="50%" y="55%" text-anchor="middle" fill="#fff"
                font-size="42" font-weight="800"
                dominant-baseline="middle"
                font-family="Arial, sans-serif">🔤</text>
        </svg>
      </div>

      <h1 class="welcome-title">
        <span>Welcome</span>
        <span>to</span>
        <span class="brand-name">Phonics Fun</span>
      </h1>

      <p class="welcome-subtitle">Let’s practise sounds together!</p>
    </div>
  </header>

  <!-- HOME -->
  <section id="home" class="screen screen--pink">
    <h1 class="home-title">Choose a set to practise</h1>
    <p class="home-helper">Start with the next week, or pick any set.</p>

    <!-- Main CTA (sticky-ish) -->
    <div class="sticky-cta">
      <button class="pill pill--cta" id="btn-practise">
        <span class="pill__icon">🔊</span>
        <span class="pill__text">Practise single letter sounds</span>
      </button>
    </div>

    <!-- Phase grouping -->
    <div class="phase-chip">Phase 2</div>

    <button class="pill pill--gold" id="btn-phase-1">Autumn 1 – Week 1</button>
    <button class="pill pill--gold" id="btn-phase-2">Autumn 1 – Week 2</button>
    <button class="pill pill--gold" id="btn-phase-3">Autumn 1 – Week 3</button>
    <button class="pill pill--gold" id="btn-phase-4">Autumn 1 – Week 4</button>
    <button class="pill pill--gold" id="btn-phase-5">Autumn 1 – Week 5</button>
    <button class="pill pill--gold" id="btn-phase-6">Autumn 2 – Week 1</button>
    <button class="pill pill--orange" id="btn-phase-7">Autumn 2 – Week 2</button>
    <button class="pill pill--orange" id="btn-phase-8">Autumn 2 – Week 3</button>
    <button class="pill pill--orange" id="btn-phase-9">Autumn 2 – Week 4</button>
    <button class="pill pill--gold" id="btn-phase-10">Autumn 2 – Week 5</button>
    <button class="pill" id="btn-s1w1">Spring 1 – Week 1</button>
    <button class="pill" id="btn-s1w2">Spring 1 – Week 2</button>
    <button class="pill" id="btn-s1w3">Spring 1 – Week 3</button>
    <button class="pill" id="btn-s1w4">Spring 1 – Week 4</button>
    <button class="pill" id="btn-s1w5">Spring 1 – Week 5</button>

    <div class="divider"></div>
    <div class="hint">Spring 2</div>
    <button id="btn-s2w1" class="pill">Spring 2 – Week 1</button>
    <button id="btn-s2w2" class="pill">Spring 2 – Week 2</button>
    <button id="btn-s2w3" class="pill">Spring 2 – Week 3</button>
    <button id="btn-s2w4" class="pill">Spring 2 – Week 4</button>

    <div class="divider"></div>
    <div class="hint">Summer 1</div>
    <button id="btn-su1w1" class="pill">Summer 1 – Week 1</button>
    <button id="btn-su1w2" class="pill">Summer 1 – Week 2</button>
    <button id="btn-su1w3" class="pill">Summer 1 – Week 3</button>
    <button id="btn-su1w4" class="pill">Summer 1 – Week 4</button>

    <div class="divider"></div>
    <div class="hint">Summer 2</div>
    <button id="btn-su2w1" class="pill">Summer 2 – Week 1</button>
    <button id="btn-su2w2" class="pill">Summer 2 – Week 2</button>
    <button id="btn-su2w3" class="pill">Summer 2 – Week 3</button>
    <button id="btn-su2w4" class="pill">Summer 2 – Week 4</button>
    <button id="btn-su2w5" class="pill pill--orange">Summer 2 – Week 5</button>
  </section>

  <!-- keep the rest of your screens exactly as they are (letters/weeks/etc.) -->
  <script src="app.js"></script>
</body>
</html>
